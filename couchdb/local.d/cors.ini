; Baked-in CORS config for the local dev CouchDB (docker-compose.couchdb.yml),
; so it survives container/volume recreation instead of needing the manual
; curl-to-_config setup redone every time. Files in /opt/couchdb/etc/local.d/
; are read by the official image at startup and merged over its defaults -
; this is the supported way to persist config without touching data.
;
; Scoped to local development only: allows the ember dev server's origin to
; talk to this CouchDB cross-origin with cookie-based auth.
[httpd]
enable_cors = true

[cors]
origins = http://localhost:4200
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, x-csrf-token
