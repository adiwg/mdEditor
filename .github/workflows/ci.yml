name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master
      - ember-migration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          package-manager-cache: false

      # Must run before the cache-enabled setup-node below: that action shells
      # out to `yarn cache dir`, which fails against the runner's global Yarn 1
      # because package.json pins packageManager to yarn@4.
      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'yarn'
          package-manager-cache: false

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint JS
        run: yarn lint:js --quiet

      - name: Lint Templates
        run: yarn lint:hbs

      - name: Lint Sass
        run: yarn lint:sass

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          package-manager-cache: false

      # See note in the lint job: Corepack must be enabled before any
      # setup-node step that uses cache: 'yarn'.
      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'yarn'
          package-manager-cache: false

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Tests
        run: |
          set -o pipefail
          echo "Using ember-exam seed: $TEST_SEED"
          if ! yarn ember exam --test-port 0 --random --seed "$TEST_SEED" 2>&1 | tee test-output.log; then
            echo "Initial run failed. Retrying once with same seed: $TEST_SEED"
            yarn ember exam --test-port 0 --random --seed "$TEST_SEED" 2>&1 | tee -a test-output.log
          fi
        env:
          CI: true
          TEST_SEED: ${{ github.run_id }}

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.log
