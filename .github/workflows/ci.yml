name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master
      - ember-migration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Must run before the cache-enabled setup-node below: that action shells
      # out to `yarn cache dir`, which fails against the runner's global Yarn 1
      # because package.json pins packageManager to yarn@4.
      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint JS
        run: yarn lint:js

      - name: Lint Templates
        run: yarn lint:hbs

      - name: Lint Sass
        run: yarn lint:sass

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # See note in the lint job: Corepack must be enabled before any
      # setup-node step that uses cache: 'yarn'.
      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Tests
        run: yarn ember exam --test-port 0 --random
        env:
          CI: true
