name: Sync staging with develop

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: sync-staging
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Fast-forward staging to develop
        run: git push origin HEAD:staging
